[package]
name = "spark-pi05"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Atlas pi0.5 vision-language-action policy"

[features]
default = ["cuda"]
cuda = ["dep:atlas-core", "atlas-core/cuda", "dep:spark-runtime", "spark-runtime/cuda"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
atlas-core = { workspace = true, optional = true }
spark-runtime = { path = "../spark-runtime", default-features = false, optional = true }
half = "2"
bytemuck = "1"
sentencepiece-rs = "0.2.2"
tracing = "0.1"
sha2.workspace = true

[lints]
workspace = true

